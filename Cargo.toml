[package]
name = "rapi"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "echo_server"
path = "src/echo_server.rs"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
url = "2"
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
dotenvy = "0.15"
async-trait = "0.1"
http-body-util = "0.1"
hf-hub = { version = "0.5", default-features = false, features = ["tokio", "rustls-tls"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
